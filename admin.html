<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Panel privado · Habla con Elocuencia</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#111214;color:#f4f4f4;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c9a35d;font-weight:800}
h1{font-size:30px;margin:6px 0 0}
.muted{color:#aaa;font-size:13px}
.login,.card{background:#1b1c1e;border:1px solid #34363a;border-radius:18px;padding:18px}
.login{max-width:460px;margin:80px auto}
label{display:block;font-size:12px;color:#c9a35d;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
input{width:100%;min-height:48px;border-radius:12px;border:1px solid #3b3d42;background:#222326;color:#fff;padding:0 14px;font-size:16px}
button{min-height:46px;border:0;border-radius:12px;background:#c9a35d;color:#151515;font-weight:800;padding:0 18px;cursor:pointer}
.login button{width:100%;margin-top:12px}
.error{color:#e09292;font-size:13px;min-height:20px;margin-top:10px}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar button.secondary{background:transparent;color:#eee;border:1px solid #3a3c40}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#1b1c1e;border:1px solid #2d2f33;border-radius:16px;padding:16px}
.stat strong{display:block;font-size:28px;color:#c9a35d}
.stat span{font-size:12px;color:#aaa}
.table-wrap{overflow-x:auto;background:#1b1c1e;border:1px solid #2d2f33;border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:14px;border-bottom:1px solid #2b2d31;font-size:13px}
th{color:#c9a35d;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.progress{height:7px;background:#313338;border-radius:999px;overflow:hidden;min-width:100px}
.progress span{display:block;height:100%;background:#c9a35d}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#25262a;color:#ddd;font-size:11px}
section{margin-top:18px}
h2{font-size:18px;margin:0 0 12px}
.event-list{display:grid;gap:8px}
.event{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;background:#1b1c1e;border:1px solid #2b2d31;border-radius:12px;font-size:13px}
.hidden{display:none!important}
@media(max-width:720px){
 main{padding:14px}
 header{align-items:flex-start;flex-direction:column}
 .stats{grid-template-columns:repeat(2,1fr)}
 h1{font-size:26px}
 .event{flex-direction:column;gap:4px}
}
</style>
</head>
<body>
<main>
  <div id="login" class="login">
    <div class="kicker">Acceso privado</div>
    <h1>Panel de seguimiento</h1>
    <p class="muted">Este panel es solo para administración.</p>
    <form id="login-form">
      <label for="password">Clave administrativa</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar al panel</button>
      <div id="login-error" class="error" aria-live="polite"></div>
    </form>
  </div>

  <div id="dashboard" class="hidden">
    <header>
      <div>
        <div class="kicker">Habla con Elocuencia</div>
        <h1>Panel privado</h1>
        <div id="updated" class="muted">Cargando…</div>
      </div>
      <div class="toolbar">
        <button id="refresh" type="button">Actualizar</button>
        <button id="logout" type="button" class="secondary">Salir</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><strong id="stat-testers">0</strong><span>Testers</span></div>
      <div class="stat"><strong id="stat-active">0</strong><span>Activos hoy</span></div>
      <div class="stat"><strong id="stat-average">0%</strong><span>Progreso promedio</span></div>
      <div class="stat"><strong id="stat-completed">0</strong><span>Programa completado</span></div>
    </div>

    <section>
      <h2>Progreso de testers</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tester</th><th>Progreso</th><th>Día / paso</th><th>Última acción</th><th>Última actividad</th></tr></thead>
          <tbody id="tester-rows"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Actividad reciente</h2>
      <div id="events" class="event-list"></div>
    </section>
  </div>
</main>
<script>
(()=>{
  const login=document.getElementById('login');
  const dashboard=document.getElementById('dashboard');
  const form=document.getElementById('login-form');
  const passwordInput=document.getElementById('password');
  const error=document.getElementById('login-error');
  const refresh=document.getElementById('refresh');
  const logout=document.getElementById('logout');
  const rows=document.getElementById('tester-rows');
  const events=document.getElementById('events');
  let password=sessionStorage.getItem('eloquence-admin-password')||'';

  function fmtDate(value){
    if(!value) return '—';
    try{return new Intl.DateTimeFormat('es-US',{dateStyle:'short',timeStyle:'short'}).format(new Date(value));}
    catch{return value;}
  }
  function eventLabel(value){
    const map={tester_started:'Inicio',session_opened:'Abrió app',step_advanced:'Avanzó paso',step_back:'Retrocedió',day_completed:'Completó día',day_started:'Inició día',day_opened:'Abrió día'};
    return map[value]||value||'—';
  }

  async function load(){
    error.textContent='';
    const response=await fetch('/api/admin',{headers:{'x-admin-password':password},cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(response.status===401){
      sessionStorage.removeItem('eloquence-admin-password');
      password='';
      dashboard.classList.add('hidden');
      login.classList.remove('hidden');
      error.textContent='Clave incorrecta.';
      passwordInput.focus();
      return;
    }
    if(!response.ok) throw new Error(data.error||'No se pudo cargar el panel');

    const testers=data.testers||[];
    const recent=data.events||[];
    const now=Date.now();
    const todayMs=24*60*60*1000;
    const active=testers.filter(t=>t.last_activity && now-new Date(t.last_activity).getTime()<=todayMs).length;
    const avg=testers.length?Math.round(testers.reduce((s,t)=>s+(Number(t.completed_count)||0),0)/(testers.length*15)*100):0;
    const completed=testers.filter(t=>Number(t.completed_count)>=15).length;

    document.getElementById('stat-testers').textContent=testers.length;
    document.getElementById('stat-active').textContent=active;
    document.getElementById('stat-average').textContent=avg+'%';
    document.getElementById('stat-completed').textContent=completed;
    document.getElementById('updated').textContent='Actualizado '+fmtDate(new Date().toISOString());

    rows.innerHTML=testers.length?testers.map(t=>{
      const count=Number(t.completed_count)||0;
      const pct=Math.round(count/15*100);
      return `<tr>
        <td><strong>${escapeHtml(t.tester_name||'Sin nombre')}</strong><br><span class="muted">${escapeHtml(t.tester_id||'')}</span></td>
        <td>${count}/15 · ${pct}%<div class="progress"><span style="width:${pct}%"></span></div></td>
        <td>Día ${Number(t.current_day)||1} · Paso ${Number(t.current_step)||1}</td>
        <td><span class="badge">${escapeHtml(eventLabel(t.last_event))}</span></td>
        <td>${escapeHtml(fmtDate(t.last_activity))}</td>
      </tr>`;
    }).join(''):`<tr><td colspan="5">Todavía no hay testers.</td></tr>`;

    events.innerHTML=recent.length?recent.map(e=>`<div class="event"><span><strong>${escapeHtml(e.tester_name||'Tester')}</strong> · ${escapeHtml(eventLabel(e.event))} · Día ${Number(e.current_day)||1}, paso ${Number(e.current_step)||1}</span><span class="muted">${escapeHtml(fmtDate(e.created_at))}</span></div>`).join(''):'<div class="muted">Sin actividad reciente.</div>';

    login.classList.add('hidden');
    dashboard.classList.remove('hidden');
  }

  function escapeHtml(value){
    return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    password=passwordInput.value;
    sessionStorage.setItem('eloquence-admin-password',password);
    try{await load();}catch(err){error.textContent=err.message;}
  });
  refresh.addEventListener('click',()=>load().catch(err=>alert(err.message)));
  logout.addEventListener('click',()=>{
    sessionStorage.removeItem('eloquence-admin-password');
    password='';
    dashboard.classList.add('hidden');
    login.classList.remove('hidden');
    passwordInput.value='';
    passwordInput.focus();
  });

  if(password){load().catch(()=>{});}
})();
</script>
</body>
</html>
